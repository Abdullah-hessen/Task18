<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap v-5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Local styling -->
    <link rel="stylesheet" href="./index.css" />
    <title>Task18</title>
  </head>
  <body>
    <main class="pt-5">
      <div class="container d-flex flex-column">
        <h1 class="fw-bold text-warning text text-center">PC Parts STORE</h1>
        <form class="my-5 d-flex gap-2">
          <input
            type="text"
            class="product-name flex-grow-1 form-control"
            placeholder="Product Name"
          />
          <input
            type="number"
            class="product-price flex-grow-1 form-control"
            placeholder="Product Price"
          />
          <button
            class="formBtn btn btn-info fw-bold text-uppercase"
            type="submit"
          >
            Create
          </button>
        </form>
        <table class="table">
          <thead>
            <tr>
              <th>NO.</th>
              <th>Product</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="tableBody"></tbody>
        </table>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
